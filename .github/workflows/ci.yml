name: RepoLens Enterprise CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Enforce least-privilege permissions across all jobs
permissions:
  contents: read

jobs:
  # 1. Dependency & Syntax Security Audit
  security-audit-and-lint:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Run Synthetic Secret Verification
        working-directory: ./backend
        run: node -e "import('./src/services/secretScanner.js').then(m => console.log('Secret scanner initialized with rules count:', m.SECRET_RULES.length))"

  # 2. Backend Test Suite (Unit, Integration, PDF Sanitizer, Advanced Analytics)
  backend-test:
    name: Backend Test Suite & PDF Sanitization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

  # 3. Frontend Component Tests & Production Bundle Build
  frontend-test-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend unit & component tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: ./frontend
        run: npm run build

  # 4. Docker Container Build & Smoke Test
  docker-build-and-smoke-test:
    name: Docker Build & Health Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        run: docker build -t repolens-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t repolens-frontend:ci ./frontend

      - name: Run backend container smoke test
        run: |
          docker run -d --name smoke-backend -p 5000:5000 repolens-backend:ci
          sleep 5
          docker ps
          curl -f http://localhost:5000/api/health || (docker logs smoke-backend && exit 1)
          docker stop smoke-backend
