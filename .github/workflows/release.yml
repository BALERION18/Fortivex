name: RepoLens Optional Release & Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Optional deployment target (e.g. staging, production, self-hosted)'
        required: false
        default: 'self-hosted'
      skip_deployment:
        description: 'Skip container deployment and only publish release archive'
        type: boolean
        required: false
        default: false

# Least-privilege permissions: write access restricted to release artifact publishing
permissions:
  contents: write
  packages: write

jobs:
  build-release-artifacts:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Create Release Archive
        run: |
          tar -czf repolens-frontend-bundle.tar.gz -C frontend/dist .
          tar -czf repolens-backend-bundle.tar.gz -C backend package.json package-lock.json src

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            repolens-frontend-bundle.tar.gz
            repolens-backend-bundle.tar.gz
          generate_release_notes: true

  optional-deployment:
    name: Optional Self-Hosted Container Deployment
    runs-on: ubuntu-latest
    needs: [build-release-artifacts]
    if: ${{ !inputs.skip_deployment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log Deployment Notice
        run: |
          echo "=========================================================="
          echo "RepoLens Optional Deployment Pipeline"
          echo "Target: ${{ inputs.deploy_target || 'self-hosted' }}"
          echo "Deployment is decoupled from CI and requires zero cloud/AWS dependencies."
          echo "Deploy locally or on any server with: docker compose up -d"
          echo "=========================================================="
